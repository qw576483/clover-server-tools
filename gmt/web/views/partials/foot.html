    <script>
        // 退出登录是唯一「每个页面都需要、又不属于任何业务」的交互，放在公共尾部。
        document.addEventListener('click', function (e) {
            if (e.target && e.target.closest && e.target.closest('#gmt-logout')) {
                gmt.confirm('确认退出登录？').then(function (ok) {
                    if (!ok) return;
                    gmt.post('/api/logout', {}).then(function () { location.href = '/login'; });
                });
            }
        });
    </script>
