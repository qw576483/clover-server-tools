{{template "head" .}}

<div class="row page-title align-items-center">
    <div class="col-12">
        <h4 class="mb-1 mt-0">玩家查询</h4>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <form class="form-inline" id="gmt-form">
                    <div class="form-group mr-2 mb-2">
                        <label class="mr-2">区服</label>
                        <select class="form-control" id="gmt-server">
                            {{range .Servers}}<option value="{{.id}}">{{.name}}</option>{{end}}
                        </select>
                    </div>
                    <div class="form-group mr-2 mb-2">
                        <label class="mr-2">方式</label>
                        <select class="form-control" id="gmt-kind">
                            <option value="player_id">角色 ID</option>
                            <option value="name">角色名</option>
                            <option value="account">账号</option>
                        </select>
                    </div>
                    <div class="form-group mr-2 mb-2">
                        <input type="text" class="form-control" id="gmt-keyword" placeholder="请输入关键字">
                    </div>
                    <button type="submit" class="btn btn-primary mb-2">
                        <i data-feather="search" class="icon-xs mr-1"></i>查询
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row d-none" id="gmt-result">
    <div class="col-xl-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mt-0 mb-3">角色信息</h5>
                <table class="table table-sm mb-0">
                    <tbody id="gmt-player"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="col-xl-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title mt-0 mb-3">主要道具</h5>
                <div class="table-responsive">
                    <table class="table table-sm table-centered mb-0">
                        <thead>
                            <tr>
                                <th>配置 ID</th>
                                <th>数量</th>
                            </tr>
                        </thead>
                        <tbody id="gmt-items"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        gmt.player.boot();
    });
</script>

{{template "foot" .}}
